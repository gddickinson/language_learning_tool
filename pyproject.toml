[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "language-learning-tool"
version = "0.1.0"
description = "Pronunciation learning tool with DTW-based audio comparison"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "soundfile>=0.10.0",
    "sounddevice>=0.4.0",
    "librosa>=0.9.0",
    "fastdtw>=0.3.4",
    "PyQt5>=5.15.0",
    "requests>=2.26.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
